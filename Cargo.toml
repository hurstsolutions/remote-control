[workspace]
resolver = "2"
members = ["crates/rc-types", "crates/rc-rdp", "crates/rc-vnc", "crates/rc-cli", "crates/rc-tunnel", "crates/rc-discover", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }

[profile.dev]
debug = 0
opt-level = 1

[profile.release]
lto = "thin"
strip = true
