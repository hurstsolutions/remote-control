[package]
name = "rc-discover"
version.workspace = true
edition.workspace = true
description = "Find RDP / Screen Sharing / SSH machines on configured subnets and the local tailnet"

[dependencies]
tokio = { workspace = true, features = ["process"] }
serde_json = "1"
tracing = { workspace = true }
serde = { workspace = true }
tokio-rustls = "0.26"
x509-cert = { version = "0.2", features = ["std"] }
sha2 = "0.10"
dns-lookup = "2"
getrandom = "0.3"

# Already in Cargo.lock through tauri; only adds the shell bindings for the Program Files folder.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_System_Com"] }

[dev-dependencies]
anyhow.workspace = true
async-trait = "0.1.92"
ironrdp-server = { version = "0.13", default-features = false, features = ["helper"] }
rcgen = "0.14.10"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
