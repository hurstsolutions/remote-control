[package]
name = "rc-tunnel"
version.workspace = true
edition.workspace = true

[dependencies]
rc-types = { path = "../rc-types" }
tokio = { workspace = true }
tracing = { workspace = true }
# Held at 0.56: every later russh pins RustCrypto pre-releases (curve25519-dalek, ecdsa, aes-gcm,
# pkcs5, rand_core) that clash with the exact pins of picky 7.0.0-rc.25, which IronRDP 0.10 needs.
# See .cargo/audit.toml. No `flate2`: SSH compression is compiled out (RUSTSEC-2026-0493), and no
# `rsa`: RSA host keys are refused anyway.
russh = { version = "0.56", default-features = false, features = ["aws-lc-rs"] }
zeroize = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }

rand_core = { version = "0.6.4", features = ["getrandom"] }
