[package]
name = "rc-tunnel"
version.workspace = true
edition.workspace = true

[dependencies]
rc-types = { path = "../rc-types" }
tokio = { workspace = true }
tracing = { workspace = true }
russh = { version = "0.56", default-features = false, features = ["aws-lc-rs", "flate2"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }

rand_core = { version = "0.6.4", features = ["getrandom"] }
