[package]
name = "rc-rdp"
version.workspace = true
edition.workspace = true

[dependencies]
rc-types = { path = "../rc-types" }
tokio = { workspace = true }
tracing = { workspace = true }
ironrdp-connector = "0.10"
ironrdp-session = "0.11"
ironrdp-tokio = { version = "0.10", features = ["reqwest"] }
ironrdp-pdu = "0.9"
ironrdp-core = "0.2"
ironrdp-graphics = "0.9"
ironrdp-input = "0.7"
ironrdp-cliprdr = "0.7"
ironrdp-dvc = "0.8"
ironrdp-displaycontrol = "0.8"
ironrdp-svc = "0.8"
sha2 = "0.10"
x509-cert = { version = "0.2", features = ["std"] }
# Our own TLS setup (not ironrdp-tls): it verifies handshake signatures so the certificate pin holds.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
zeroize = "1"

[dev-dependencies]
anyhow.workspace = true
async-trait = "0.1.92"
ironrdp-server = { version = "0.13", default-features = false, features = ["helper"] }
rcgen = "0.14.10"
aws-lc-rs = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
