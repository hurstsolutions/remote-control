# Builds installable apps. Runs only when asked (Actions > Release > Run workflow) or on a
# version tag, because macOS runner minutes are billed at 10x on private repositories.
name: Release
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Which platforms to build"
        type: choice
        default: macos
        options: [macos, macos+linux, all]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
          - name: windows
            os: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Decide whether this platform is wanted
        id: want
        shell: bash
        run: |
          sel="${{ github.event.inputs.platforms || 'all' }}"
          case "$sel:${{ matrix.name }}" in
            all:*|macos:macos|macos+linux:macos|macos+linux:linux) echo "run=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
      - name: Linux packages
        if: steps.want.outputs.run == 'true' && matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev pkg-config
      - name: NASM (Windows crypto build)
        if: steps.want.outputs.run == 'true' && matrix.name == 'windows'
        uses: ilammy/setup-nasm@v1
      - uses: dtolnay/rust-toolchain@stable
        if: steps.want.outputs.run == 'true'
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        if: steps.want.outputs.run == 'true'
        with:
          key: release-${{ matrix.name }}
      - uses: actions/setup-node@v4
        if: steps.want.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install front end dependencies
        if: steps.want.outputs.run == 'true'
        working-directory: app
        run: npm ci
      - name: Build and publish
        if: steps.want.outputs.run == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || format('Test build {0}', github.run_number) }}
          releaseBody: "Unsigned test build. See the Asana task for install steps."
          releaseDraft: false
          prerelease: true
